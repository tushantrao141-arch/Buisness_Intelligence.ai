services:
  silentsignal-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: silentsignal:latest
    container_name: silentsignal-app
    ports:
      - "8501:8501"
    environment:
      - PYTHONUNBUFFERED=1
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_HEADLESS=true
    volumes:
      - ./artifacts:/app/artifacts
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  silentsignal-test:
    build:
      context: .
      dockerfile: Dockerfile
    image: silentsignal:latest
    container_name: silentsignal-test
    profiles:
      - test
    command: ["python", "-m", "unittest", "discover", "-s", "tests", "-v"]
